apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-hub.fullname" . }}
  labels:
    {{- include "project-hub.labels" . | nindent 4 }}
spec:
  # SQLite and a single RWO volume require a single writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "project-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "project-hub.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: project-hub
          image: "{{ required "Set image.repository to your pushed image" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set existingSecret to an existing credentials Secret" .Values.existingSecret }}
                  key: APP_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SESSION_SECRET
            - name: APP_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: APP_ADMIN_NAME
              value: {{ .Values.admin.name | quote }}
            - name: DB_PATH
              value: /data/project-hub.db
            - name: COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "project-hub.fullname" . }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
